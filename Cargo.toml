[package]
name = "rust_rest_api_example"
version = "0.0.1"
edition = "2024"

[dependencies]
axum = "0.8.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "time"] }
tracing-appender = "0.2"
tower-http = { version = "0.7.1", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "macros", "postgres", "chrono", "uuid"] }
postgres = "0.19"
refinery = { version = "0.10", features = ["postgres"]}
dotenvy = "0.15.7"
tonic = "0.14.7"
prost = "0.14.4"
tonic-prost-build = "0.14.7"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[[test]]
# Directory-style integration test binary: `tests/api/main.rs` + modules beside it.
name = "api"
path = "tests/api/main.rs"
# `main.rs`-entry test targets default to `harness = false`; we need it on so
# the `#[tokio::test]` fns in `mod tasks` are collected individually.
harness = true

[build-dependencies]
tonic-prost-build = "0.14.7"
